<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projektplaner</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-2">
      <span class="text-2xl">⚡</span>
      <h1 class="text-xl font-bold tracking-wide text-white">Projektplaner</h1>
    </div>
    <div class="flex gap-2">
      <button id="exportBtn" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm transition">Export JSON</button>
      <button id="importBtn" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm transition">Import JSON</button>
      <input type="file" id="importFile" class="hidden" accept=".json">
    </div>
  </header>

  <!-- New Task Input Form -->
  <section class="p-4 bg-slate-800/50 border-b border-slate-700/50">
    <form id="newTaskForm" class="max-w-4xl mx-auto flex gap-2">
      <input 
        type="text" 
        id="taskInput" 
        placeholder="Neue Aufgabe eingeben..." 
        required 
        class="flex-1 bg-slate-900 border border-slate-700 rounded px-4 py-2 text-slate-100 focus:outline-none focus:border-blue-500"
      >
      <select id="prioritySelect" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
        <option value="low">Niedrig</option>
        <option value="medium" selected>Mittel</option>
        <option value="high">Hoch</option>
      </select>
      <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-5 py-2 rounded transition shadow">
        + Hinzufügen
      </button>
    </form>
  </section>

  <!-- Kanban Board Columns -->
  <main class="flex-1 p-6 overflow-x-auto">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-7xl mx-auto h-full min-h-[500px]">
      
      <!-- Column: To Do -->
      <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 flex flex-col shadow-lg">
        <h2 class="font-bold text-lg mb-4 text-slate-300 flex items-center justify-between">
          <span>📋 To Do</span>
          <span id="count-todo" class="text-xs bg-slate-700 px-2 py-1 rounded-full">0</span>
        </h2>
        <div id="todo" class="kanban-column flex-1 flex flex-col gap-3 min-h-[150px]" data-status="todo"></div>
      </div>

      <!-- Column: In Progress -->
      <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 flex flex-col shadow-lg">
        <h2 class="font-bold text-lg mb-4 text-amber-400 flex items-center justify-between">
          <span>⏳ In Bearbeitung</span>
          <span id="count-inprogress" class="text-xs bg-slate-700 px-2 py-1 rounded-full">0</span>
        </h2>
        <div id="inprogress" class="kanban-column flex-1 flex flex-col gap-3 min-h-[150px]" data-status="inprogress"></div>
      </div>

      <!-- Column: Done -->
      <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 flex flex-col shadow-lg">
        <h2 class="font-bold text-lg mb-4 text-emerald-400 flex items-center justify-between">
          <span>✅ Erledigt</span>
          <span id="count-done" class="text-xs bg-slate-700 px-2 py-1 rounded-full">0</span>
        </h2>
        <div id="done" class="kanban-column flex-1 flex flex-col gap-3 min-h-[150px]" data-status="done"></div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
